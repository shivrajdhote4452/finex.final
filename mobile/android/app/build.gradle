plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.finex.mobile"
    compileSdkVersion 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.finex.mobile"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                def sf = keystoreProperties['storeFile']
                if (sf) {
                    def resolved = file(sf)
                    if (!resolved.exists() && rootProject.file(sf).exists()) {
                        resolved = rootProject.file(sf)
                    }
                    storeFile resolved
                }
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                // Do NOT fall back silently to debug signing for release builds.
                // Insecure debug signing fallback permanently removed.
                signingConfig null
            }
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def isReleaseBuild = taskGraph.allTasks.any { task ->
        def name = task.name.toLowerCase()
        return name.contains("assemblerelease") || name.contains("bundlerelease")
    }
    if (isReleaseBuild) {
        if (!keystorePropertiesFile.exists()) {
            throw new GradleException(
                "RELEASE BUILD FAILED: Insecure / missing release signing configuration!\n" +
                "'mobile/android/key.properties' was not found.\n" +
                "Silent fallback to debug signing has been permanently disabled for release builds.\n" +
                "Please configure 'mobile/android/key.properties' with valid release credentials.\n" +
                "See 'mobile/android/key.properties.example' for instructions."
            )
        }
        def requiredKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
        for (key in requiredKeys) {
            if (!keystoreProperties.getProperty(key)) {
                throw new GradleException("RELEASE BUILD FAILED: 'key.properties' is missing required property: ${key}")
            }
        }
        def sf = keystoreProperties.getProperty('storeFile')
        def resolved = file(sf)
        if (!resolved.exists() && rootProject.file(sf).exists()) {
            resolved = rootProject.file(sf)
        }
        if (!resolved.exists()) {
            throw new GradleException("RELEASE BUILD FAILED: Keystore file '${sf}' specified in 'key.properties' does not exist.")
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
