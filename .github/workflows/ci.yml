name: FinEx Quality Gates & CI

on:
  push:
    branches: [main, master, develop, "fix/**"]
  pull_request:
    branches: [main, master, develop, "fix/**"]

jobs:
  backend-quality-gates:
    name: Backend Quality Gates & Acceptance Matrix
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finex_ci_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_password@localhost:5432/finex_ci_db
      ENVIRONMENT: testing

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.lock ]; then
            pip install -r backend/requirements.lock
          else
            pip install -r backend/requirements.txt
          fi
          pip install ruff pytest pytest-asyncio pytest-cov httpx

      - name: Check dependency consistency
        run: |
          python -m pip check

      - name: Run Ruff Linter
        run: |
          ruff check backend ai data

      - name: Run Ruff Formatter Check
        run: |
          ruff format --check backend ai data

      - name: Validate Alembic Schema Generation (Offline SQL)
        run: |
          python -m alembic upgrade head --sql

      - name: Apply Alembic Migrations to CI PostgreSQL
        run: |
          python -m alembic upgrade head

      - name: Run Backend Pytest Suite with Coverage
        run: |
          # Measured coverage was ~62% on 25 Oct 2026; gate is set to 60% as a baseline floor (must be raised, never lowered, as tests land)
          pytest --cov=backend/app --cov-fail-under=60 --cov-report=xml --cov-report=term -m "not live" backend/tests

      - name: Run AI Module Tests
        run: |
          pytest -q ai/tests

      - name: Run AI Evaluation Baseline Check (S1-AI-03)
        run: |
          python ai/evaluation/evaluate.py

  web-quality-gates:
    name: Web Frontend TypeCheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Run TypeScript Verification & Vite Production Build
        working-directory: ./web
        run: npm run build
