name: FinEx Quality Gates & CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-quality-gates:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov

      - name: Run Ruff Linter
        run: |
          ruff check backend ai

      - name: Run Ruff Formatter Check
        run: |
          ruff format --check backend ai

      - name: Run Backend Pytest Suite with Coverage
        run: |
          pytest --cov=backend/app --cov-report=xml --cov-report=term backend/tests

      - name: Run AI Evaluation Baseline Check (S1-AI-03)
        run: |
          python ai/evaluation/evaluate.py
