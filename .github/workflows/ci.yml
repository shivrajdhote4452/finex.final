name: FinEx Quality Gates & CI

on:
  push:
    branches: [main, master, develop, "fix/**"]
  pull_request:
    branches: [main, master, develop, "fix/**"]

jobs:
  backend-quality-gates:
    name: Backend Quality Gates & Acceptance Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov httpx

      - name: Check dependency consistency
        run: |
          python -m pip check

      - name: Run Ruff Linter
        run: |
          ruff check backend ai data

      - name: Run Ruff Formatter Check
        run: |
          ruff format --check backend ai data

      - name: Validate Alembic Schema Generation
        run: |
          python -m alembic upgrade head --sql

      - name: Run Backend Pytest Suite with Coverage
        run: |
          pytest --cov=backend/app --cov-report=xml --cov-report=term backend/tests

      - name: Run AI Module Tests
        run: |
          pytest -q ai/tests

      - name: Run AI Evaluation Baseline Check (S1-AI-03)
        run: |
          python ai/evaluation/evaluate.py

  web-quality-gates:
    name: Web Frontend TypeCheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Run TypeScript Verification & Vite Production Build
        working-directory: ./web
        run: npm run build
